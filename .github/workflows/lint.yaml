name: Lint

on:
  push:
    branches:
      - main

  pull_request_target:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-checkout:
    name: Pre checkout
    uses: ./.github/workflows/pre-checkout.yaml

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - pre-checkout
    strategy:
      matrix:
        linter:
          - eslint
          - stylelint
          - typescript
        include:
          - linter: eslint
            linter-command-name: lint:eslint
            linter-cache-version: v1
          - linter: stylelint
            linter-command-name: lint:stylelint
            linter-cache-version: v1
          - linter: typescript
            linter-command-name: lint:typescript
    env:
      linter-cache-path: ${{ github.workspace }}/node_modules/.cache/${{ matrix.linter }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.pre-checkout.outputs.sha }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Restore ${{ matrix.linter }} cache
        if: ${{ matrix.linter-cache-version }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.linter-cache-path }}
          key: ${{ matrix.linter }}-${{ matrix.linter-cache-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ needs.pre-checkout.outputs.sha }}
          restore-keys: ${{ matrix.linter }}-${{ matrix.linter-cache-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Run ${{ matrix.linter }} command
        run: |
          pnpm run ${{ matrix.linter-command-name }} ${{ matrix.linter-cache-version && format('--cache --cache-location ''{0}'' --cache-strategy content', env.linter-cache-path) || '' }}